<!doctype html>
<html>
<head><meta charset="utf-8"/><title>Login</title><link rel="stylesheet" href="/web/styles.css"></head>
<body>
  <div class="card center">
    <h2>Login</h2>
    <input id="u" placeholder="Username">
    <input id="p" placeholder="Password" type="password">
    <button class="btn" id="btn">Login</button>
    <p class="muted">No account? <a href="/web/register.html">Register</a></p>
    <p><a href="/">Back</a></p>
    <div id="msg" class="muted"></div>
  </div>

  <script src="/web/app.js"></script>
  <script>
    $("btn").onclick = async () => {
      $("msg").textContent = "";
      try{
        await login($("u").value.trim(), $("p").value);
        $("msg").textContent = "Logged in. Redirecting...";
        window.location.href = "/";
      }catch(e){
        $("msg").textContent = e.message;
      }
    };
  </script>
</body>
</html>
