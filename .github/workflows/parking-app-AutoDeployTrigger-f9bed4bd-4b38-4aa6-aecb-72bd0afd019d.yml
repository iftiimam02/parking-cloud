name: Deploy to Azure Container Apps

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Azure Login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.PARKINGAPP_AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.PARKINGAPP_AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.PARKINGAPP_AZURE_SUBSCRIPTION_ID }}

      - name: Build and Deploy
        uses: azure/container-apps-deploy-action@v2
        with:
          appSourcePath: ${{ github.workspace }}
          dockerfilePath: Dockerfile

          registryUrl: ${{ secrets.PARKINGAPP_REGISTRY_SERVER }}
          registryUsername: ${{ secrets.PARKINGAPP_REGISTRY_USERNAME }}
          registryPassword: ${{ secrets.PARKINGAPP_REGISTRY_PASSWORD }}

          containerAppName: parking-app
          resourceGroup: garirakho_rrg
          ingress: external
          targetPort: 8000

          imageToBuild: ${{ secrets.PARKINGAPP_REGISTRY_SERVER }}/parking-app:${{ github.sha }}
          imageToDeploy: ${{ secrets.PARKINGAPP_REGISTRY_SERVER }}/parking-app:${{ github.sha }}
